server:
  port: 8080

spring:
  application:
    name: vacanza-backend

  profiles:
    active: dev # security kapatmak için dev ortamına ayarladım

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

geoapify:
  base-url: https://api.geoapify.com/v2
  api-key: ${GEOAPIFY_API_KEY}

mapbox:
  access-token: ${MAPBOX_ACCESS_TOKEN}

ai-service:
  base-url: ${AI_SERVICE_BASE_URL}
  connect-timeout: 15s
  read-timeout: 120s

serpapi:
  base-url: https://serpapi.com
  api-key: ${SERPAPI_API_KEY}
  connect-timeout: 10s
  read-timeout: 30s

ticketmaster:
  base-url: https://app.ticketmaster.com/discovery/v2
  api-key: ${TICKETMASTER_API_KEY}
  connect-timeout: 10s
  read-timeout: 30s

# Open-Meteo: free forecast API, no API key (https://open-meteo.com/)
open-meteo:
  base-url: https://api.open-meteo.com/v1
  connect-timeout: 10s
  read-timeout: 30s

# POI retrieval scoring (PoiScoreCalculator). avoid-mode: DROP | PENALTY
vacanza:
  poi-scoring:
    weight-rating: 2.0
    weight-popularity: 1.0
    favorite-bonus: 3.0
    avoid-penalty: 50.0
    neutral-rating-prior: 0.5
    avoid-mode: DROP
  poi-diversity:
    enabled: true
    target-count: 60
    pool-size: 120
    mode: MMR
    mmr-lambda: 0.72
    max-per-family: 4
  poi-constraints:
    budget-enabled: true
    budget-currency-strict: true
    expected-budget-currency: USD
    budget-mode: DROP
    budget-penalty: 25
    tier-1-max-budget: 45
    tier-2-max-budget: 95
    tier-3-max-budget: 190
    closed-day-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
