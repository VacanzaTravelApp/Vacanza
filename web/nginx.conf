server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # If a reverse proxy in front sends /auth/* to a Java API, exclude Firebase email links:
    #   location = /auth/action { proxy_pass off; try_files /index.html =404; }  # or route to this same SPA host

    location / {
        try_files $uri /index.html;
    }
}
