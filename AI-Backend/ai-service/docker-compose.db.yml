# Local PostgreSQL with pgvector — for AI development
# Run: docker compose -f docker-compose.db.yml up -d

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vacanza-ai-postgres
    environment:
      POSTGRES_USER: vacanza
      POSTGRES_PASSWORD: vacanza
      POSTGRES_DB: vacanza_ai
    ports:
      - "5432:5432"
    volumes:
      - ai_postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vacanza -d vacanza_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ai_postgres_data:
