services:
  ai-service:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: vacanza
      POSTGRES_PASSWORD: vacanza
      POSTGRES_DB: vacanza_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vacanza -d vacanza_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
